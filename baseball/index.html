<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKT Baseball · League Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #06091a;
  --surface:   #0c1428;
  --surface2:  #111d35;
  --border:    #1c2d4a;
  --text:      #e2e8f0;
  --muted:     #5a7090;
  --win:       #34d399;
  --loss:      #f87171;
  --roster:    #818cf8;
  --log:       #34d399;
  --standings: #22d3ee;
  --batting:   #fb923c;
  --pitching:  #f472b6;
  --gamelog:   #fbbf24;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  min-height: 100vh;
}

/* ── HEADER ── */
.header {
  border-bottom: 1px solid var(--border);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.pulse {
  width: 8px; height: 8px;
  background: var(--win);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--win);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.hdr-sub   { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
.hdr-title { font-size: 18px; font-weight: 700; cursor: pointer; }

/* ── MAIN ── */
.main { padding: 28px; max-width: 1340px; margin: 0 auto; }

/* ── SECTION LABELS ── */
.sec-label {
  font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .15em;
  margin-bottom: 4px;
}
.sec-title {
  font-size: 26px; font-weight: 800;
  margin-bottom: 24px;
}

/* ── STATS BAR ── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  background: var(--border);
  gap: 1px;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 24px;
}
.stat-cell    { background: var(--surface); padding: 18px 20px; text-align: center; }
.stat-val     { font-size: 30px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
.stat-lbl     { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

/* ── LEADER CARDS ── */
.leaders-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.leader-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
}
.leader-lbl  { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
.leader-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.leader-stat { font-size: 28px; font-weight: 800; line-height: 1; }
.leader-sub  { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

/* ── NAV GRID ── */
.nav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 12px;
  margin-bottom: 32px;
}
.nav-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  cursor: pointer;
  transition: transform .15s, border-color .15s, background .15s;
}
.nav-card:hover { transform: translateY(-3px); background: var(--surface2); }
.nav-icon  { font-size: 24px; margin-bottom: 10px; }
.nav-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.nav-sub   { font-size: 12px; color: var(--muted); }

/* ── GAME ROW ── */
.game-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px 18px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.game-result { font-size: 13px; font-weight: 800; width: 18px; text-align: center; }
.game-result.W { color: var(--win); }
.game-result.L { color: var(--loss); }
.game-score  { font-size: 18px; font-weight: 800; min-width: 54px; }
.game-vs     { flex: 1; min-width: 100px; }
.game-opp    { font-size: 14px; font-weight: 500; }
.game-meta   { font-size: 11px; color: var(--muted); margin-top: 2px; }
.game-notes  { font-size: 12px; color: var(--muted); font-style: italic; flex: 2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ha-badge    { font-size: 10px; padding: 2px 7px; border-radius: 4px; background: var(--surface2); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }

/* ── ROSTER ── */
.roster-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 12px;
}
.player-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  cursor: pointer;
  transition: transform .15s, border-color .15s;
  position: relative;
}
.player-card:hover { transform: translateY(-2px); }
.pl-num     { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.pl-name    { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.pl-pos     { font-size: 12px; }
.pl-stats   { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
.pl-stat-v  { font-size: 17px; font-weight: 800; line-height: 1; }
.pl-stat-l  { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
.del-btn    {
  position: absolute; top: 12px; right: 12px;
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 14px; padding: 2px 4px;
  border-radius: 4px; transition: color .15s;
  opacity: 0;
}
.player-card:hover .del-btn { opacity: 1; }
.del-btn:hover { color: var(--loss) !important; }

/* ── TABS ── */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab {
  padding: 7px 14px; border-radius: 8px;
  font-size: 11px; font-weight: 600;
  cursor: pointer; border: 1px solid var(--border);
  color: var(--muted); background: transparent;
  transition: all .15s; text-transform: uppercase; letter-spacing: .08em;
}
.tab.active { background: var(--surface2); border-color: var(--standings); color: var(--standings); }
.tab:hover  { color: var(--text); }

/* ── TABLE ── */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: auto;
  margin-bottom: 24px;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  padding: 11px 14px;
  font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--muted); text-align: left;
  border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none; white-space: nowrap;
}
thead th:hover { color: var(--text); }
thead th.sorted { color: var(--standings); }
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }
tbody td { padding: 11px 14px; white-space: nowrap; }

/* ── FORM ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(6,9,26,.88);
  display: flex; align-items: center; justify-content: center;
  z-index: 50; padding: 20px;
}
.form-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  width: 100%; max-width: 540px;
  max-height: 90vh; overflow-y: auto;
}
.form-title { font-size: 17px; font-weight: 700; margin-bottom: 20px; }
.form-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fg { display: flex; flex-direction: column; gap: 5px; }
.fg.full { grid-column: 1 / -1; }
.fg label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
input, select, textarea {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px;
  color: var(--text); font-size: 13px; width: 100%;
  transition: border-color .15s;
}
input:focus, select:focus { outline: none; border-color: var(--standings); }
.form-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
.btn { padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all .15s; }
.btn-primary { background: var(--standings); color: #06091a; }
.btn-primary:hover { opacity: .88; }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--muted); }
.btn-ghost:hover { color: var(--text); border-color: var(--text); }

/* ── BACK ── */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--muted); background: none; border: none;
  cursor: pointer; margin-bottom: 20px; text-transform: uppercase; letter-spacing: .08em;
}
.back-btn:hover { color: var(--text); }

/* ── STREAK BOXES ── */
.streak { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
.sb {
  width: 20px; height: 20px; border-radius: 4px;
  font-size: 9px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.sb.W { background: rgba(52,211,153,.2); color: var(--win); }
.sb.L { background: rgba(248,113,113,.15); color: var(--loss); }
.sb.T { background: rgba(100,116,139,.2); color: var(--muted); }

/* ── PREVIEW BOX ── */
.preview {
  margin-top: 14px; padding: 12px 16px;
  border-radius: 10px; background: var(--surface2); border: 1px solid var(--border);
  font-size: 13px; color: var(--muted);
}

/* ── RESPONSIVE ── */
@media (max-width: 580px) {
  .main { padding: 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .sec-title { font-size: 20px; }
}
</style>
</head>
